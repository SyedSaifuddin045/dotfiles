config-version = 2

# Register AeroSpace as a login item so the setup restores on reboot
start-at-login = true

# Reload config automatically when file saved — experiment freely
auto-reload-config = true

# Start Sketchybar together with AeroSpace
# sketchybar detects already-running process, safe to re-run
after-startup-command = ['exec-and-forget sketchybar']

# Notify Sketchybar when workspace changes + save state for wake restore
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE && aerospace list-windows --all --format "%{app-bundle-id}|%{window-title}|%{workspace}" > ~/.config/aerospace/.workspace-state'
]

# Default layout for new workspaces
default-root-container-layout = 'tiles'

# Disable tree normalizations so the i3-style `split` command works
# (split is a no-op when these are enabled). Tradeoff: manual splits can
# produce nested containers; flatten-workspace-tree (alt-r) resets.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Gaps so tiled windows are visually separated
gaps.inner.horizontal = 8
gaps.inner.vertical = 8
gaps.outer.left = 8
gaps.outer.bottom = 8
gaps.outer.top = 8
gaps.outer.right = 8

# STRICT TILING MODE: every window tiles by default. This catch-all (first,
# with check-further-callbacks) overrides AeroSpace's dialog auto-float
# heuristic, so nothing floats unless toggled manually with alt-f.
# No app is pinned to a workspace anymore — apps open in your current
# workspace; move them with alt-shift-<number>.
on-window-detected = [
    { check-further-callbacks = true, run = 'layout tiling' },
    # Refresh SketchyBar workspace strips whenever any new window appears
    { if = 'true', run = 'exec-and-forget sketchybar --trigger windows_refresh' },
]

[mode.main.binding]
    # Launch terminal
    alt-enter = 'exec-and-forget open -a Ghostty'

    # Workspace switching
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    # Whole-workspace tiling direction for next windows
    # (Cmd+Opt so it doesn't clash with Cmd+V paste / Cmd+H hide app)
    cmd-alt-v = 'layout tiles vertical'
    cmd-alt-h = 'layout tiles horizontal'

    # Per-window split: reserve a slot so the NEXT window lands below /
    # beside the focused window (works because normalizations are disabled)
    cmd-alt-shift-v = 'split vertical'
    cmd-alt-shift-h = 'split horizontal'

    # Reset a workspace tree back to a single container (escape hatch for
    # messy split trees)
    alt-r = 'flatten-workspace-tree'

    # Move window to workspace (and follow it there)
    alt-shift-1 = 'move-node-to-workspace 1; workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2; workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3; workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4; workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5; workspace 5'

    # Move window to workspace WITHOUT switching (stay where you are)
    # bash-sequenced refresh since focused-workspace event won't fire here
    # (exec-and-forget can't be chained with ';' — CLI parser rejects it)
    alt-ctrl-1 = 'exec-and-forget aerospace move-node-to-workspace 1 && sketchybar --trigger windows_refresh'
    alt-ctrl-2 = 'exec-and-forget aerospace move-node-to-workspace 2 && sketchybar --trigger windows_refresh'
    alt-ctrl-3 = 'exec-and-forget aerospace move-node-to-workspace 3 && sketchybar --trigger windows_refresh'
    alt-ctrl-4 = 'exec-and-forget aerospace move-node-to-workspace 4 && sketchybar --trigger windows_refresh'
    alt-ctrl-5 = 'exec-and-forget aerospace move-node-to-workspace 5 && sketchybar --trigger windows_refresh'

    # Focus navigation (vim-style)
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move focused window
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Toggle window between floating and tiled (escape hatch)
    alt-f = 'layout floating tiling'

    # Fullscreen focused window
    alt-shift-f = 'fullscreen'

    # Switch back to previous workspace
    alt-tab = 'workspace-back-and-forth'

    # Reload config
    alt-shift-c = 'reload-config'

    # Screenshot region to clipboard
    alt-shift-s = 'exec-and-forget screencapture -i -c'